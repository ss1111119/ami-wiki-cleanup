<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>翻譯校對 — 翻譯校對平台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <a href="list.html" class="back-link">← 回清單</a>
    <span id="articleTitle" class="logo"></span>
    <div class="header-right">
      <span id="saveStatus" class="save-status"></span>
      <button id="logoutBtn" class="btn-sm">登出</button>
    </div>
  </header>

  <div class="editor-toolbar">
    <div class="article-info">
      <a id="amiWikiLink" href="#" target="_blank" class="wiki-link">ami Wikipedia ↗</a>
      <a id="zhWikiLink" href="#" target="_blank" class="wiki-link">中文維基 ↗</a>
    </div>
    <div class="status-control">
      狀態：
      <select id="statusSelect">
        <option value="pending">待校對</option>
        <option value="in_review">校對中</option>
        <option value="approved">已完成 ✓</option>
      </select>
    </div>
  </div>

  <div class="editor-guide">
    <strong>校對說明：</strong>右欄為 AI 翻譯初稿，請直接修改成正確的阿美語，並在「校對備註」欄記錄修改原因。
  </div>
  <div class="editor-warn">
    ⚠️ <strong>數字請用阿拉伯數字：</strong>AI 常把數字（年份、面積、百分比等）拼成阿美語數詞，<u>且數值經常翻錯</u>（例：63 被拼成 16）。請對照中文原文，把數字改回正確的阿拉伯數字，如 <code>1819</code>、<code>735 sq km</code>、<code>90%</code>。
  </div>

  <!-- 編輯器主排版與搜尋邊欄 -->
  <div class="editor-main-layout">
    <div class="editor-content-area">
      <!-- 詞彙對照表（摺疊） -->
      <div id="vocabPanel" class="vocab-panel" style="display:none">
        <div class="vocab-header" onclick="document.getElementById('vocabBody').classList.toggle('hidden')">
          📖 詞彙對照表（點擊展開／收合）
          <span id="vocabToggle">▾</span>
        </div>
        <div id="vocabBody">
          <div id="vocabContent" class="vocab-content">載入中...</div>
        </div>
      </div>

      <div id="sectionsContainer" class="sections-container">
        <div class="loading">載入中...</div>
      </div>
    </div>
  </div>

  <div class="save-bar">
    <button id="saveAllBtn" class="btn-save">儲存所有修改</button>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore, doc, getDoc, collection, getDocs, updateDoc, serverTimestamp, orderBy, query } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    import { FIREBASE_CONFIG } from './config.js';

    const app = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const params = new URLSearchParams(location.search);
    const articleId = params.get('id');
    if (!articleId) window.location.href = 'list.html';

    let currentUser = null;

    onAuthStateChanged(auth, async user => {
      if (!user) { window.location.href = 'index.html'; return; }
      currentUser = user;
      loadArticle();
    });

    document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

    async function loadArticle() {
      try {
        const articleDoc = await getDoc(doc(db, 'translations', articleId));
        if (!articleDoc.exists()) { alert('找不到此條目'); return; }

        const article = articleDoc.data();
        document.getElementById('articleTitle').textContent = `${article.ami_title}（${article.zh_title || ''}）`;
        document.title = `校對：${article.ami_title}`;
        document.getElementById('amiWikiLink').href = article.ami_wiki_url || '#';
        document.getElementById('zhWikiLink').href = article.zh_source_url || '#';
        document.getElementById('statusSelect').value = article.status || 'pending';

        // 載入詞彙對照表
        if (article.vocab && article.vocab.length > 0) {
          document.getElementById('vocabPanel').style.display = 'block';
          renderVocab(article.vocab);
        }

        const sectionsSnap = await getDocs(query(collection(db, 'translations', articleId, 'sections'), orderBy('order')));
        const container = document.getElementById('sectionsContainer');
        container.innerHTML = '';

        sectionsSnap.forEach(sDoc => {
          const s = sDoc.data();
          container.appendChild(buildSectionEl(sDoc.id, s));
        });
      } catch(e) {
        document.getElementById('sectionsContainer').innerHTML = `<div class="error-msg">載入失敗：${e.message}</div>`;
      }
    }

    // ── 逐詞追蹤修訂 ──
    const sectionState = new Map(); // sectionId -> { baseline, current }

    function tokenize(t) { return (t || '').match(/\s+|[^\s]+/g) || []; }

    // 逐詞 LCS diff，回傳 ops 序列：{t:'eq'|'del'|'ins', s}
    function diffOps(aStr, bStr) {
      const a = tokenize(aStr), b = tokenize(bStr);
      const n = a.length, m = b.length;
      const dp = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
      for (let i = n - 1; i >= 0; i--)
        for (let j = m - 1; j >= 0; j--)
          dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      const ops = []; let i = 0, j = 0;
      while (i < n && j < m) {
        if (a[i] === b[j]) { ops.push({ t: 'eq', s: a[i] }); i++; j++; }
        else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: 'del', s: a[i] }); i++; }
        else { ops.push({ t: 'ins', s: b[j] }); j++; }
      }
      while (i < n) ops.push({ t: 'del', s: a[i++] });
      while (j < m) ops.push({ t: 'ins', s: b[j++] });
      return ops;
    }

    // 把 ops 分組：eq 為 context，連續 del/ins 為一個 change
    function groupChanges(ops) {
      const groups = []; let cur = null;
      for (const op of ops) {
        if (op.t === 'eq') { if (cur) { groups.push(cur); cur = null; } groups.push({ change: false, ops: [op] }); }
        else { if (!cur) cur = { change: true, ops: [] }; cur.ops.push(op); }
      }
      if (cur) groups.push(cur);
      return groups;
    }

    function renderDiff(sectionId) {
      const st = sectionState.get(sectionId);
      const groups = groupChanges(diffOps(st.baseline, st.current));
      let ci = -1, body = '', hasChange = false;
      for (const g of groups) {
        if (!g.change) { body += `<span class="d-eq">${escHtml(g.ops.map(o => o.s).join(''))}</span>`; continue; }
        hasChange = true; ci++;
        const del = g.ops.filter(o => o.t === 'del').map(o => o.s).join('');
        const ins = g.ops.filter(o => o.t === 'ins').map(o => o.s).join('');
        body += `<span class="d-change" data-ci="${ci}">`;
        if (del) body += `<del class="d-del">${escHtml(del)}</del>`;
        if (ins) body += `<ins class="d-ins">${escHtml(ins)}</ins>`;
        body += `<span class="d-ctrl"><button type="button" class="d-accept" data-ci="${ci}" title="接受此修改">✓</button><button type="button" class="d-reject" data-ci="${ci}" title="拒絕、還原底稿">✗</button></span></span>`;
      }
      const head = hasChange
        ? `<div class="d-legend"><del>底稿刪除</del> <ins>老師新增</ins>　每處可 ✓接受／✗拒絕</div>`
        : `<div class="d-legend d-nochange">尚無修訂（與底稿相同）。切到「編輯」修改後，這裡會顯示改了什麼。</div>`;
      return head + body;
    }

    // 接受=採用老師版（current）；拒絕=還原底稿（baseline）
    function resolveChange(sectionId, ci, accept) {
      const st = sectionState.get(sectionId);
      const groups = groupChanges(diffOps(st.baseline, st.current));
      let idx = -1; const newOps = [];
      for (const g of groups) {
        if (!g.change) { newOps.push(...g.ops); continue; }
        idx++;
        if (idx !== ci) { newOps.push(...g.ops); continue; }
        for (const op of g.ops) {
          if (accept) { if (op.t === 'ins') newOps.push({ t: 'eq', s: op.s }); }
          else { if (op.t === 'del') newOps.push({ t: 'eq', s: op.s }); }
        }
      }
      st.baseline = newOps.filter(o => o.t !== 'ins').map(o => o.s).join('');
      st.current = newOps.filter(o => o.t !== 'del').map(o => o.s).join('');
    }

    function buildSectionEl(sectionId, s) {
      const current = s.ami_reviewed || s.ami_ai || '';
      const baseline = (s.ami_baseline != null && s.ami_baseline !== '') ? s.ami_baseline : current;
      sectionState.set(sectionId, { baseline, current });

      const div = document.createElement('div');
      div.className = 'section-block';
      div.dataset.sectionId = sectionId;
      div.innerHTML = `
        <div class="section-title">
          <span>${escHtml(s.title || '段落')}</span>
          <span class="mode-toggle">
            <button type="button" data-mode="edit" class="active">✏️ 編輯</button>
            <button type="button" data-mode="review">👁 修訂檢視</button>
          </span>
        </div>
        <div class="section-grid">
          <div class="col-zh">
            <div class="col-label">中文原文</div>
            <div class="zh-text">${escHtml(s.zh_text || '')}</div>
          </div>
          <div class="col-ami">
            <div class="col-label">阿美語翻譯（可直接修改）</div>
            <div class="ami-edit-pane">
              <textarea class="ami-textarea" data-field="ami_reviewed" rows="6">${escHtml(current)}</textarea>
            </div>
            <div class="ami-review-pane" style="display:none">
              <div class="diff-view"></div>
            </div>
            <div class="col-label" style="margin-top:10px">校對備註</div>
            <textarea class="note-textarea" data-field="comments" rows="2" placeholder="記錄修改原因或不確定之處…">${escHtml(s.comments || '')}</textarea>
          </div>
        </div>
        <div class="ai-ref">
          <details>
            <summary>AI 原始翻譯（參考）</summary>
            <div class="ai-text">${escHtml(s.ami_ai || '')}</div>
          </details>
        </div>
      `;
      const ta = div.querySelector('.ami-textarea');
      ta.addEventListener('input', () => { sectionState.get(sectionId).current = ta.value; });
      return div;
    }

    // 委派處理：模式切換 + 接受/拒絕
    document.getElementById('sectionsContainer').addEventListener('click', (e) => {
      const block = e.target.closest('.section-block');
      if (!block) return;
      const sectionId = block.dataset.sectionId;

      const modeBtn = e.target.closest('.mode-toggle button');
      if (modeBtn) {
        const mode = modeBtn.dataset.mode;
        block.querySelectorAll('.mode-toggle button').forEach(b => b.classList.toggle('active', b === modeBtn));
        const editPane = block.querySelector('.ami-edit-pane');
        const reviewPane = block.querySelector('.ami-review-pane');
        const ta = block.querySelector('.ami-textarea');
        if (mode === 'review') {
          sectionState.get(sectionId).current = ta.value;
          block.querySelector('.diff-view').innerHTML = renderDiff(sectionId);
          editPane.style.display = 'none';
          reviewPane.style.display = 'block';
        } else {
          ta.value = sectionState.get(sectionId).current;
          reviewPane.style.display = 'none';
          editPane.style.display = 'block';
        }
        return;
      }

      const btn = e.target.closest('.d-accept, .d-reject');
      if (btn) {
        resolveChange(sectionId, parseInt(btn.dataset.ci, 10), btn.classList.contains('d-accept'));
        block.querySelector('.diff-view').innerHTML = renderDiff(sectionId);
        block.querySelector('.ami-textarea').value = sectionState.get(sectionId).current;
      }
    });

    function renderVocab(vocab) {
      const statusMap = {
        ok:      '<span class="vb ok">✅ 正確</span>',
        warn:    '<span class="vb warn">⚠️ 偏差</span>',
        err:     '<span class="vb err">❌ 不對</span>',
        missing: '<span class="vb missing">字典未收錄</span>'
      };
      // 阿美語詞：有值才用 code 樣式，空值（—）以淡灰短線顯示
      const amiCell = v => {
        const t = (v || '').trim();
        return (!t || t === '—') ? '<span class="vb-dash">—</span>' : `<code>${escHtml(t)}</code>`;
      };
      const dictCell = v => {
        const t = (v || '').trim();
        return (!t || t === '—') ? '<span class="vb-dash">—</span>' : escHtml(t);
      };
      const rows = vocab.map(v => `
        <tr>
          <td class="vc-zh">${escHtml(v.zh || '')}</td>
          <td class="vc-ami">${amiCell(v.ami_coast)}</td>
          <td class="vc-dict">${dictCell(v.dict_coast)}</td>
          <td class="vc-ami">${amiCell(v.ami_xiuguluan)}</td>
          <td class="vc-dict">${dictCell(v.dict_xiuguluan)}</td>
          <td class="vc-status">${statusMap[v.status] || ''}</td>
          <td class="vc-note">${escHtml(v.note || '')}</td>
        </tr>`).join('');
      document.getElementById('vocabContent').innerHTML = `
        <p class="vocab-note">資料來源：阿美語萌典（蔡中涵大辭典）。<strong>萌典為單一辭典，非按方言分版</strong>；下表「萌典定義」是把海岸／秀姑巒兩種方言的詞各自拿去同一部萌典查到的意思。</p>
        <table class="vocab-table">
          <thead><tr><th>中文</th><th>海岸阿美語</th><th>萌典定義</th><th>秀姑巒阿美語</th><th>萌典定義</th><th>狀態</th><th>老師請確認</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    document.getElementById('vocabBody').addEventListener('transitionend', () => {
      const toggle = document.getElementById('vocabToggle');
      toggle.textContent = document.getElementById('vocabBody').classList.contains('hidden') ? '▸' : '▾';
    });

    document.getElementById('saveAllBtn').addEventListener('click', saveAll);
    document.getElementById('statusSelect').addEventListener('change', saveStatus);

    async function saveStatus() {
      try {
        await updateDoc(doc(db, 'translations', articleId), {
          status: document.getElementById('statusSelect').value,
          last_modified: serverTimestamp()
        });
        showSaveStatus('狀態已更新');
      } catch(e) { showSaveStatus('儲存失敗', true); }
    }

    async function saveAll() {
      const btn = document.getElementById('saveAllBtn');
      btn.disabled = true;
      btn.textContent = '儲存中...';
      showSaveStatus('');

      try {
        const blocks = document.querySelectorAll('.section-block');
        const promises = [];
        blocks.forEach(block => {
          const sectionId = block.dataset.sectionId;
          const st = sectionState.get(sectionId);
          // 編輯模式時以 textarea 最新值為準
          if (block.querySelector('.ami-edit-pane').style.display !== 'none') {
            st.current = block.querySelector('.ami-textarea').value;
          }
          const comments = block.querySelector('[data-field="comments"]').value;
          promises.push(updateDoc(
            doc(db, 'translations', articleId, 'sections', sectionId),
            { ami_reviewed: st.current, ami_baseline: st.baseline, comments, reviewed_by: currentUser.email, reviewed_at: serverTimestamp() }
          ));
        });
        await Promise.all(promises);
        await updateDoc(doc(db, 'translations', articleId), { last_modified: serverTimestamp() });
        showSaveStatus('✓ 已儲存');
      } catch(e) {
        showSaveStatus('儲存失敗：' + e.message, true);
      }
      btn.disabled = false;
      btn.textContent = '儲存所有修改';
    }

    function showSaveStatus(msg, isError = false) {
      const el = document.getElementById('saveStatus');
      el.textContent = msg;
      el.style.color = isError ? '#e74c3c' : '#27ae60';
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
